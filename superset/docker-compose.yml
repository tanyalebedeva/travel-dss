# Apache Superset с дашбордом СППР. Запуск из папки superset/:  docker compose up
# Затем откройте http://localhost:8088  (логин admin / пароль admin) → Dashboards → «СППР: выбор места для путешествия»
services:
  superset:
    image: apache/superset:4.1.2
    container_name: tdss-superset
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: "tdss-change-me-please-0123456789"
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    volumes:
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./data:/app/tdss_data
      - ./dashboard_export.zip:/app/dashboard_export.zip:ro
      - ./bootstrap.sh:/app/bootstrap.sh:ro
    command: ["/bin/bash", "/app/bootstrap.sh"]
